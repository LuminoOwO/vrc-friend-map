<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14252e"/>
      <stop offset="1" stop-color="#070c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19c3b1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#19c3b1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe8d8"/>
      <stop offset="1" stop-color="#12a294"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>
  <!-- a circle of friends: a soft outline around a group, like on the map -->
  <ellipse cx="318" cy="300" rx="150" ry="118" transform="rotate(-24 318 300)" fill="#19c3b1" fill-opacity="0.07" stroke="#19c3b1" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
  <!-- lines between friends who know each other -->
  <g stroke-linecap="round" fill="none">
    <path d="M232 262 L120 150 M232 262 L372 128 M232 262 L388 360 M232 262 L134 392 M372 128 L388 360 M388 360 L134 392" stroke="#19c3b1" stroke-opacity="0.75" stroke-width="12"/>
    <path d="M120 150 L372 128" stroke="#8fd3ff" stroke-opacity="0.35" stroke-width="8"/>
  </g>
  <circle cx="232" cy="262" r="120" fill="url(#glow)"/>
  <!-- friends: bubbles with status rings -->
  <g stroke="#070c10" stroke-width="10">
    <circle cx="120" cy="150" r="40" fill="#22313d"/>
    <circle cx="372" cy="128" r="44" fill="#22313d"/>
    <circle cx="388" cy="360" r="50" fill="#22313d"/>
    <circle cx="134" cy="392" r="36" fill="#22313d"/>
  </g>
  <g fill="none" stroke-width="12">
    <circle cx="120" cy="150" r="34" stroke="#42caff"/>
    <circle cx="372" cy="128" r="38" stroke="#51e57e"/>
    <circle cx="388" cy="360" r="44" stroke="#ff6bcb"/>
    <circle cx="134" cy="392" r="30" stroke="#e8a33d"/>
  </g>
  <!-- you, in the middle -->
  <circle cx="232" cy="262" r="74" fill="#070c10"/>
  <circle cx="232" cy="262" r="62" fill="url(#hub)"/>
  <circle cx="232" cy="262" r="62" fill="none" stroke="#bafff6" stroke-width="8" stroke-opacity="0.9"/>
  <circle cx="232" cy="244" r="20" fill="#06302b" fill-opacity="0.55"/>
  <path d="M196 300 a36 30 0 0 1 72 0" fill="#06302b" fill-opacity="0.55"/>
</svg>
