[package]
name = "vrc-friend-map"
version = "0.14.0"
description = "Map your VRChat friends, mutuals and circles"
edition = "2021"
license = "MIT"
repository = "https://github.com/LuminoOwO/vrc-friend-map"
rust-version = "1.77"

[lib]
name = "vrc_friend_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
vfm-share = { path = "../crates/vfm-share" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
# Small previews for the pictures gallery (src/pictures.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
# Linux build on Chromium (CEF) instead of WebKitGTK. Needs the extra setup
# that scripts/chromium.py does (Tauri's CEF runtime isn't released yet);
# scripts/build-linux.sh uses it by default.
chromium = []

# Android: read cookies through android.webkit.CookieManager (see auth.rs).
# Same version as wry's, so JniHandle::exec closures get matching types.
[target.'cfg(target_os = "linux")'.dependencies]
# Mouse wheel fallback for X11 (src/wheelfix.rs); loads libX11 / libXi at runtime.
x11-dl = "2.21"
raw-window-handle = "0.6"
# Notifications without the desktop's own sound (src/silent_notify.rs).
notify-rust = "4.18"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Picture previews are decoded in `npm run tauri dev` too: without optimisation a 1080p PNG
# takes ten times longer, so the image crates are always built optimised.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
