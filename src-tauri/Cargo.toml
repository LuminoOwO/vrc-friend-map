[package]
name = "vrc-friend-map"
version = "0.3.2"
description = "Map your VRChat friends, mutuals and circles"
edition = "2021"
license = "MIT"
repository = "https://github.com/LuminoOwO/vrc-friend-map"
rust-version = "1.77"

[lib]
name = "vrc_friend_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Android: read cookies through android.webkit.CookieManager (see auth.rs).
# Same version as wry's, so JniHandle::exec closures get matching types.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
