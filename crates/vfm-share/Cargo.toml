[package]
name = "vfm-share"
version = "0.7.2"
description = "Protocol shared by VRC Friend Map and its server: identities, signed requests, end-to-end sealed envelopes"
edition = "2021"
license = "MIT"
repository = "https://github.com/LuminoOwO/vrc-friend-map"
rust-version = "1.77"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
