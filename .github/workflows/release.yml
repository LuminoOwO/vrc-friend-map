# Builds every platform and publishes them as a GitHub Release.
#
# Start it in one of two ways:
#   - Actions tab -> "Release builds" -> Run workflow -> enter the tag, e.g. v0.3.0.
#     If that release doesn't exist yet, it's created (tag on the commit you run
#     it from, notes from CHANGELOG.md). If it exists, its tagged commit is
#     rebuilt and the files are replaced.
#   - Push a tag: git tag v0.3.0 && git push origin v0.3.0
#     (also happens when you publish a release with a new tag on the website).
#
# Pushing a branch named build-check/<anything> runs the same builds without
# releasing anything (files end up as workflow artifacts), to test changes to
# the build itself.
#
# Android needs four repository secrets so every version is signed with the
# same key (otherwise phones refuse to update and you'd have to reinstall):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See README -> "Releases" for how to make them. Without them only the
# Android job fails; re-run it after adding the secrets.
name: Release builds

on:
  push:
    tags: ["v*"]
    branches: ["build-check/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.3.0 (must match package.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # "check" = build only, no release.
  MODE: ${{ startsWith(github.ref, 'refs/heads/build-check/') && 'check' || 'release' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit to build
        id: pick
        run: |
          SHA="$GITHUB_SHA"
          if [ "$MODE" = release ]; then
            case "$TAG" in v[0-9]*) ;; *) echo "::error::Tag must look like v1.2.3, got '$TAG'"; exit 1 ;; esac
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then SHA=$(git rev-list -n1 "$TAG"); fi
          fi
          git checkout -q "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building $TAG ($MODE) from $SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches the app version
        if: env.MODE == 'release'
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          CARGO=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          TAURI=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [ "${TAG#v}" != "$VERSION" ] || [ "$VERSION" != "$CARGO" ] || [ "$VERSION" != "$TAURI" ]; then
            echo "::error::Tag $TAG, package.json $VERSION, Cargo.toml $CARGO and tauri.conf.json $TAURI must all match"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npx tsc --noEmit && npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Server and protocol tests
        run: |
          cargo test --manifest-path crates/vfm-share/Cargo.toml
          cargo test --manifest-path server/Cargo.toml
      - name: App against a real server (end to end)
        run: |
          cargo build --manifest-path server/Cargo.toml
          mkdir -p "$RUNNER_TEMP/srv"
          printf '[server]\nlisten = "127.0.0.1:8799"\n[access]\nregistration = "open"\n[admin]\nallow = "local"\ntoken = "citoken0123456789abcdef"\n' > "$RUNNER_TEMP/srv/vfm-server.toml"
          server/target/debug/vfm-server --config "$RUNNER_TEMP/srv/vfm-server.toml" > "$RUNNER_TEMP/srv/log.txt" 2>&1 &
          sleep 2
          VFM_TEST_SERVER=http://127.0.0.1:8799 VFM_TEST_TOKEN=citoken0123456789abcdef VFM_TEST_DATA="$RUNNER_TEMP/srv/vfm-data" \
            cargo test --manifest-path src-tauri/Cargo.toml --lib e2e -- --ignored || { cat "$RUNNER_TEMP/srv/log.txt"; exit 1; }
      - name: Create the release if it doesn't exist
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; files will be added to it."
          else
            # Created as a draft; the last job publishes it once the files are attached.
            node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "${{ steps.pick.outputs.sha }}" \
              --title "VRC Friend Map ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --draft
          fi

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 keeps the packages compatible with older distros. Free ARM
        # runners are only available to public repositories.
        runner: ${{ fromJSON(github.event.repository.private && '["ubuntu-22.04"]' || '["ubuntu-22.04","ubuntu-22.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev file
      - name: Build deb, rpm, AppImage and tarball
        run: |
          set -o pipefail
          CI=true ./scripts/build-linux.sh all 2>&1 | tee "$RUNNER_TEMP/build.log"
      - run: rm -f release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: release/*
          if-no-files-found: error
      - name: Show the end of the build log
        if: failure()
        run: node scripts/log-tail.mjs "$RUNNER_TEMP/build.log"

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build installer (NSIS), MSI and portable exe
        run: |
          set -o pipefail
          npx tauri build --bundles nsis,msi 2>&1 | tee "$RUNNER_TEMP/build.log"
      - run: node scripts/collect-release.mjs windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error
      - name: Show the end of the build log
        if: failure()
        run: node scripts/log-tail.mjs "$RUNNER_TEMP/build.log"

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build universal dmg (unsigned)
        run: |
          set -o pipefail
          npx tauri build --target universal-apple-darwin --bundles dmg 2>&1 | tee "$RUNNER_TEMP/build.log"
      - run: node scripts/collect-release.mjs macos
      # vfm-server for Mac in the same job: macOS runners are scarce.
      - name: vfm-server universal binary
        run: |
          set -o pipefail
          cd server
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          {
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
          } 2>&1 | tee "$RUNNER_TEMP/server.log"
          D="$RUNNER_TEMP/vfm-server-$VERSION-macos-universal"
          mkdir -p "$D"
          lipo -create -output "$D/vfm-server" target/aarch64-apple-darwin/release/vfm-server target/x86_64-apple-darwin/release/vfm-server
          cp README.md ../LICENSE "$D/"
          tar -C "$RUNNER_TEMP" -czf "../release/vfm-server-$VERSION-macos-universal.tar.gz" "vfm-server-$VERSION-macos-universal"
          ls -la ../release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*
          if-no-files-found: error
      - name: Show the end of the build log
        if: failure()
        run: node scripts/log-tail.mjs "$RUNNER_TEMP/build.log"

  android:
    needs: test
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Signing key present
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            if [ "$MODE" = check ]; then
              echo "::warning::No Android signing secrets; the check build stays unsigned."
            else
              echo "::error::Android signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (README -> Releases), then re-run this job."
              exit 1
            fi
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build APK (arm64, armv7, x86_64)
        run: |
          set -o pipefail
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          {
            npx tauri android init --ci
            cat packaging/android/proguard-extra.pro >> src-tauri/gen/android/app/proguard-rules.pro
            npx tauri android build --apk --ci --target aarch64 --target armv7 --target x86_64
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Sign APK
        run: |
          APK=$(find src-tauri/gen/android -name "*-release-unsigned.apk" | head -n1)
          [ -n "$APK" ] || { echo "::error::No unsigned APK found: $(find src-tauri/gen/android -name '*.apk' | tr '\n' ' ')"; exit 1; }
          # Methods the Rust side calls by name must survive the shrinker.
          mkdir -p "$RUNNER_TEMP/dex" && unzip -q -o "$APK" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          for m in getCookies clearAllBrowsingData loadUrlMainThread evalScript; do
            grep -aq "$m" "$RUNNER_TEMP"/dex/classes*.dex || { echo "::error::$m was stripped from the APK; the app would crash. Check packaging/android/proguard-extra.pro"; exit 1; }
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            node scripts/collect-release.mjs android "$RUNNER_TEMP/aligned.apk"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk" | head -n 3
          node scripts/collect-release.mjs android "$RUNNER_TEMP/signed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*
          if-no-files-found: error
      - name: Show the end of the build log
        if: failure()
        run: node scripts/log-tail.mjs "$RUNNER_TEMP/build.log"

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: brew install xcodegen || true
      - name: Build unsigned IPA (for sideloading)
        run: |
          set -o pipefail
          {
            npx tauri ios init --ci
            npx tauri ios build --ci --no-sign --target aarch64
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - run: node scripts/collect-release.mjs ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: release/*
          if-no-files-found: error
      - name: Show the end of the build log
        if: failure()
        run: node scripts/log-tail.mjs "$RUNNER_TEMP/build.log"

  # vfm-server: one small file per platform, no dependencies.
  server-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,arm-unknown-linux-musleabihf,i686-unknown-linux-musl,aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          key: server-linux
      - name: Tools
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build (static Linux; Android/Termux with the NDK)
        run: |
          set -o pipefail
          cd server
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p ../release
          pack() { # target name
            local dir="$RUNNER_TEMP/pkg/vfm-server-$VERSION-$2"
            mkdir -p "$dir"
            cp "target/$1/release/vfm-server" "$dir/"
            cp README.md ../LICENSE "$dir/"
            cp packaging/vfm-server.service "$dir/" 2>/dev/null || true
            tar -C "$RUNNER_TEMP/pkg" -czf "../release/vfm-server-$VERSION-$2.tar.gz" "vfm-server-$VERSION-$2"
          }
          {
            for t in x86_64-unknown-linux-musl:linux-x86_64 aarch64-unknown-linux-musl:linux-arm64 armv7-unknown-linux-musleabihf:linux-armv7 arm-unknown-linux-musleabihf:linux-armv6 i686-unknown-linux-musl:linux-x86; do
              cargo zigbuild --release --target "${t%%:*}"
              pack "${t%%:*}" "${t##*:}"
            done
            NDK="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android24-clang" CC_aarch64_linux_android="$NDK/aarch64-linux-android24-clang" AR_aarch64_linux_android="$NDK/llvm-ar"
            export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK/armv7a-linux-androideabi24-clang" CC_armv7_linux_androideabi="$NDK/armv7a-linux-androideabi24-clang" AR_armv7_linux_androideabi="$NDK/llvm-ar"
            cargo build --release --target aarch64-linux-android && pack aarch64-linux-android android-termux-arm64
            cargo build --release --target armv7-linux-androideabi && pack armv7-linux-androideabi android-termux-armv7
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -la ../release
          file target/*/release/vfm-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: release/*
          if-no-files-found: error
      - name: Show the end of the build log
        if: failure()
        run: node scripts/log-tail.mjs "$RUNNER_TEMP/build.log"

  server-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          key: server-windows
      - name: Build
        run: |
          set -o pipefail
          cd server
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          cargo build --release 2>&1 | tee "$RUNNER_TEMP/build.log"
          D="$RUNNER_TEMP/vfm-server-$VERSION-windows-x64"
          mkdir -p "$D" ../release
          cp target/release/vfm-server.exe README.md ../LICENSE "$D/"
          (cd "$RUNNER_TEMP" && 7z a -tzip "$GITHUB_WORKSPACE/release/vfm-server-$VERSION-windows-x64.zip" "vfm-server-$VERSION-windows-x64" >/dev/null)
          ls -la ../release
      - uses: actions/upload-artifact@v4
        with:
          name: server-windows
          path: release/*
          if-no-files-found: error
      - name: Show the end of the build log
        if: failure()
        run: node scripts/log-tail.mjs "$RUNNER_TEMP/build.log"

  publish:
    needs: [test, linux, windows, macos, android, ios, server-linux, server-windows]
    # Attach whatever finished, even if one platform failed.
    if: ${{ always() && needs.test.result == 'success' && !startsWith(github.ref, 'refs/heads/build-check/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir -p upload
          find artifacts -type f ! -name SHA256SUMS -exec cp {} upload/ \;
          cd upload && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Upload to the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" upload/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Release files"
            echo
            echo "| Platform | Result |"
            echo "|---|---|"
            echo "| Linux | ${{ needs.linux.result }} |"
            echo "| Windows | ${{ needs.windows.result }} |"
            echo "| macOS | ${{ needs.macos.result }} |"
            echo "| Android | ${{ needs.android.result }} |"
            echo "| iOS | ${{ needs.ios.result }} |"
            echo "| Server (Linux, Android/Termux) | ${{ needs.server-linux.result }} |"
            echo "| Server (Windows) | ${{ needs.server-windows.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
