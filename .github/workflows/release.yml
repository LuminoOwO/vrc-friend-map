# Builds every platform and attaches the files to a GitHub Release.
#
# Runs when a release is published (GitHub web UI: Releases -> Draft a new
# release -> pick or create a tag like v0.3.0 -> Publish), or by hand from the
# Actions tab ("Run workflow", optionally with a tag to attach the files to).
#
# Android needs four repository secrets so every version is signed with the
# same key (otherwise phones refuse to update and you'd have to reinstall):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See README -> "Releases" for how to make them.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the files to (e.g. v0.3.0). Empty = just build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npx tsc --noEmit && npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Tag matches the app version
        if: github.event.release.tag_name || inputs.tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION=$(node -p 'require("./package.json").version')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match the app version $VERSION in package.json"
            exit 1
          fi

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 keeps the packages compatible with older distros. Free ARM
        # runners are only available to public repositories.
        runner: ${{ fromJSON(github.event.repository.private && '["ubuntu-22.04"]' || '["ubuntu-22.04","ubuntu-22.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev file
      - name: Build deb, rpm, AppImage and tarball
        run: CI=true ./scripts/build-linux.sh all
      - run: rm -f release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: release/*
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build installer (NSIS), MSI and portable exe
        run: npx tauri build --bundles nsis,msi
      - run: node scripts/collect-release.mjs windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build universal dmg (unsigned)
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - run: node scripts/collect-release.mjs macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Signing key present
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (README -> Releases), then re-run this job."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build APK (arm64, armv7, x86_64)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri android build --apk --ci --target aarch64 --target armv7 --target x86_64
      - name: Sign APK
        run: |
          APK=$(find src-tauri/gen/android -name "*-release-unsigned.apk" | head -n1)
          [ -n "$APK" ] || { echo "::error::No unsigned APK found"; find src-tauri/gen/android -name "*.apk"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          export KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk" | head -n 3
          rm -f "$RUNNER_TEMP/release.keystore"
          node scripts/collect-release.mjs android "$RUNNER_TEMP/signed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*
          if-no-files-found: error

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: brew install xcodegen || true
      - name: Build unsigned IPA (for sideloading)
        run: |
          npx tauri ios init --ci
          npx tauri ios build --ci --no-sign --target aarch64
      - run: node scripts/collect-release.mjs ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: release/*
          if-no-files-found: error

  publish:
    needs: [test, linux, windows, macos, android, ios]
    # Attach whatever finished, even if one platform failed.
    if: ${{ always() && needs.test.result == 'success' && (github.event.release.tag_name || inputs.tag) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir -p upload
          find artifacts -type f ! -name SHA256SUMS -exec cp {} upload/ \;
          cd upload && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" upload/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Release files"
            echo
            echo "| Platform | Result |"
            echo "|---|---|"
            echo "| Linux | ${{ needs.linux.result }} |"
            echo "| Windows | ${{ needs.windows.result }} |"
            echo "| macOS | ${{ needs.macos.result }} |"
            echo "| Android | ${{ needs.android.result }} |"
            echo "| iOS | ${{ needs.ios.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
