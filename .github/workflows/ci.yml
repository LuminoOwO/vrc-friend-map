# Quick checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: System libraries
        timeout-minutes: 15
        run: |
          # Ubuntu's mirrors sometimes hang: give each try 3 minutes, up to 3 tries.
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          for try in 1 2 3; do
            timeout 180 sudo apt-get $APT update && timeout 300 sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev && break
            [ $try = 3 ] && exit 1; echo "::warning::package install try $try failed, retrying"; sleep 10
          done
      - run: npm ci
      - name: Type check and frontend tests
        run: |
          npx tsc --noEmit
          npm test
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
