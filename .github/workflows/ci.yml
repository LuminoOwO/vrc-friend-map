# Quick checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides where the tests run: my PC when it's online and idle, else GitHub.
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - id: pick
        uses: ./.github/actions/pick-runner
        with:
          token: ${{ secrets.RUNNER_STATUS_TOKEN }}
          mode: ${{ vars.USE_MY_PC }}
          allowed: ${{ !github.event.pull_request.head.repo.fork }}

  test:
    # My PC (RunnerDock) if it's online and idle, otherwise GitHub's runners; see the pick job.
    # Pull requests from forks always use GitHub's runners.
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: System libraries
        run: |
          # a|b = either package will do (Linux Mint ships the Ayatana tray library, which conflicts with
          # libappindicator3; the app's tray-icon crate works with both). The first one gets installed.
          PKGS="libwebkit2gtk-4.1-dev libappindicator3-dev|libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev"
          MISSING=$(for alt in $PKGS; do
            ok=; for p in ${alt//|/ }; do dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "ok installed" && ok=1; done
            [ -n "$ok" ] || printf '%s ' "${alt%%|*}"
          done)
          MISSING=${MISSING% }
          if [ -z "$MISSING" ]; then echo "All system libraries present"; exit 0; fi
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # no sudo on your own PC: install them once yourself
            HINT=${MISSING/libappindicator3-dev/libayatana-appindicator3-dev}
            echo "::error::Missing on this machine: $MISSING. Run once: sudo apt install $HINT"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y $MISSING
      - run: npm ci
      - name: Type check and frontend tests
        run: |
          npx tsc --noEmit
          npm test
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
