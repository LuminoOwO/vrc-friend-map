[package]
name = "vfm-server"
version = "0.7.1"
description = "Small always-on helper for VRC Friend Map: logs friends' instance hopping and exchanges (end-to-end encrypted) friend lists and activity"
edition = "2021"
license = "MIT"
repository = "https://github.com/LuminoOwO/vrc-friend-map"
rust-version = "1.77"

[[bin]]
name = "vfm-server"
path = "src/main.rs"

[dependencies]
vfm-share = { path = "../crates/vfm-share" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "signal", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
